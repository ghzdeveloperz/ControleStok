name: Deploy production

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install web dependencies
        run: npm ci --ignore-scripts
      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Validate Functions syntax
        run: node --check functions/index.js
      - name: Prepare pinned Firebase CLI
        run: npx --yes firebase-tools@15.17.0 --version
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROLLSTOK }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy Functions first
        run: npx --offline --yes firebase-tools@15.17.0 deploy --only functions --project controllstok --non-interactive
      - name: Deploy Hosting
        run: npx --offline --yes firebase-tools@15.17.0 deploy --only hosting --project controllstok --non-interactive
      - name: Enforce Firestore rules and indexes
        run: npx --offline --yes firebase-tools@15.17.0 deploy --only firestore:rules,firestore:indexes --project controllstok --non-interactive
