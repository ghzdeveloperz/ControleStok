name: Deploy production

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  secret_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Block secrets in repository history
        run: bash scripts/ci-secret-scan.sh

  validate:
    needs: secret_scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            tools/firebase-cli/package-lock.json
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install and verify pinned npm
        run: |
          npm install --global --ignore-scripts npm@11.7.0
          test "$(npm --version)" = "11.7.0"
      - name: Install web dependencies
        run: npm ci --ignore-scripts
      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Install pinned Firebase CLI
        run: npm ci --prefix tools/firebase-cli --ignore-scripts
      - name: Audit dependencies
        run: npm run security:audit
      - name: Lint
        run: npm run lint
      - name: Require the production App Check site key
        env:
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.FIREBASE_APPCHECK_SITE_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_APPCHECK_SITE_KEY" ]; then
            echo "::error::Configure the FIREBASE_APPCHECK_SITE_KEY repository variable before deploying."
            exit 1
          fi
      - name: Build
        env:
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.FIREBASE_APPCHECK_SITE_KEY }}
        run: npm run build
      - name: Validate Functions syntax
        run: npm run check --prefix functions
      - name: Validate pinned Firebase CLI
        run: node tools/firebase-cli/run-firebase.cjs --version
      - name: Test Firebase rules
        run: node tools/firebase-cli/run-firebase.cjs emulators:exec --only firestore,storage "npm run test:rules" --project demo-mystoreday-rules
      - name: Test Auth and Functions integration
        run: node tools/firebase-cli/run-firebase.cjs emulators:exec --only auth,firestore,functions "npm run test:functions" --project demo-mystoreday-functions
      - name: Test workspace security migration
        run: node tools/firebase-cli/run-firebase.cjs emulators:exec --only firestore "npm run test:migration" --project demo-mystoreday-migration
      - name: Test credential provisioning and rotation
        run: node tools/firebase-cli/run-firebase.cjs emulators:exec --only auth,firestore "npm run test:provision" --project demo-mystoreday-provision
      - name: Test Hosting security headers
        run: node tools/firebase-cli/run-firebase.cjs emulators:exec --only hosting "npm run test:hosting" --project demo-mystoreday-hosting
      - name: Store validated web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tools/firebase-cli/package-lock.json
      - name: Install and verify pinned npm
        run: |
          npm install --global --ignore-scripts npm@11.7.0
          test "$(npm --version)" = "11.7.0"
      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Install pinned Firebase CLI
        run: npm ci --prefix tools/firebase-cli --ignore-scripts
      - name: Validate pinned Firebase CLI
        run: node tools/firebase-cli/run-firebase.cjs --version
      - name: Restore validated web build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: dist
      - name: Enforce App Check in deployed Functions
        run: printf '%s\n' 'APP_CHECK_ENFORCE=true' > functions/.env.controllstok
      - id: auth
        name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: controllstok
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deny legacy client writes first
        run: node tools/firebase-cli/run-firebase.cjs deploy --only firestore:rules,firestore:indexes,storage --project controllstok --non-interactive
      - name: Deploy secure Functions
        run: node tools/firebase-cli/run-firebase.cjs deploy --only functions --project controllstok --non-interactive
      - name: Deploy Hosting last
        run: node tools/firebase-cli/run-firebase.cjs deploy --only hosting --project controllstok --non-interactive
      - name: Verify published Hosting headers
        env:
          HOSTING_VERIFY_URL: https://controllstok.web.app
        run: npm run test:hosting
